name: Secret Detection

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret & Token Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Custom Regex Secret Scan
        if: always()
        run: |
          python3 -c '
          import re, sys, subprocess

          patterns = [
              r"(?i)(api[_-]?key|secret[_-]?key|access[_-]?token|auth[_-]?token|private[_-]?key)\s*[:=]\s*[\"'\'''][A-Za-z0-9_\-\.]{16,}[\"'\''']",
              r"ghp_[A-Za-z0-9]{36}",
              r"github_pat_[A-Za-z0-9]{22}_[A-Za-z0-9]{59}",
              r"AKIA[0-9A-Z]{16}",
              r"-----BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY-----"
          ]

          # Get changed files in PR
          try:
              diff_output = subprocess.check_output(["git", "diff", "HEAD~1", "HEAD"], text=True)
          except Exception:
              diff_output = ""

          found = False
          for line in diff_output.splitlines():
              if line.startswith("+") and not line.startswith("+++"):
                  for pat in patterns:
                      if re.search(pat, line):
                          print(f"::error::Potential secret detected in diff: {line.strip()}")
                          found = True

          if found:
              sys.exit(1)
          else:
              print("No hardcoded secrets found in diff.")
          '
