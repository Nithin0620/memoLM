name: PR Size Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  size-label:
    name: Label PR by Size
    runs-on: ubuntu-latest
    steps:
      - name: Calculate PR Size and Add Label
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const additions = pullRequest.additions;
            const deletions = pullRequest.deletions;
            const totalChanges = additions + deletions;

            let sizeLabel = 'M';
            if (totalChanges < 10) {
              sizeLabel = 'XS';
            } else if (totalChanges <= 50) {
              sizeLabel = 'S';
            } else if (totalChanges <= 200) {
              sizeLabel = 'M';
            } else if (totalChanges <= 500) {
              sizeLabel = 'L';
            } else {
              sizeLabel = 'XL';
            }

            const sizeLabels = ['XS', 'S', 'M', 'L', 'XL', 'size: XS', 'size: S', 'size: M', 'size: L', 'size: XL'];
            const currentLabels = pullRequest.labels.map(l => l.name);

            // Remove previous size labels if any
            for (const label of currentLabels) {
              if (sizeLabels.includes(label) && label !== sizeLabel) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pullRequest.number,
                    name: label
                  });
                } catch (e) {
                  console.log(`Label ${label} not present or error removing: ${e}`);
                }
              }
            }

            // Add current size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              labels: [sizeLabel]
            });
            console.log(`PR #${pullRequest.number} total changes: ${totalChanges}. Labeled as ${sizeLabel}`);
