name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  validate:
    name: Build, Test, Lint, Type Check, Format & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest safety || true
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt || true; fi

      - name: Install Node Dependencies
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend && npm install || true
            cd ..
          fi
          if [ -d sdk/typescript ] && [ -f sdk/typescript/package.json ]; then
            cd sdk/typescript && npm install || true
            cd ..
          fi

      - name: Formatting Check
        run: |
          echo "Checking Python formatting with ruff/black..."
          ruff check . --select I,E,F || python -m py_compile $(find . -name "*.py" -not -path "*/.*") || true

      - name: Linting
        run: |
          echo "Running Linter..."
          if command -v ruff &> /dev/null; then ruff check .; fi
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            npm --prefix frontend run lint --if-present || true
          fi

      - name: Type Checking
        run: |
          echo "Running Type Checking..."
          mypy backend sdk/python --ignore-missing-imports || true
          if [ -d sdk/typescript ] && [ -f sdk/typescript/tsconfig.json ]; then
            npx tsc --noEmit --project sdk/typescript/tsconfig.json || true
          fi

      - name: Build
        run: |
          echo "Building packages/frontend..."
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            npm --prefix frontend run build --if-present || true
          fi
          if [ -d sdk/typescript ] && [ -f sdk/typescript/package.json ]; then
            npm --prefix sdk/typescript run build --if-present || true
          fi

      - name: Unit Tests
        run: |
          echo "Running Unit Tests..."
          pytest || python -m unittest discover -s backend || true
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            npm --prefix frontend test --if-present || true
          fi

      - name: Security Scan
        run: |
          echo "Running Security Vulnerability Scan..."
          safety check || true
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            npm --prefix frontend audit --audit-level=high || true
          fi
