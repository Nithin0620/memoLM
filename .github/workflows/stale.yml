name: PR Stale Detection

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark Stale Pull Requests and Issues
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-message: 'This pull request has been automatically marked as stale because it has had no activity for 14 days. It will be closed in 7 days if no further activity occurs.'
          close-pr-message: 'This pull request has been automatically closed because it remained inactive.'
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,keep-open'
